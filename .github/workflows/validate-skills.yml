name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate each skill's frontmatter
        run: |
          set -euo pipefail
          failed=0
          for d in .skills/*/; do
            name="$(basename "$d")"
            [ -f "${d}SKILL.md" ] || continue
            echo "Validating $name..."
            if ! (cd .skills/skill-creator && python -m scripts.quick_validate "../$name"); then
              echo "::error::$name failed validation"
              failed=1
            fi
          done
          exit "$failed"

      - name: Check discovery symlinks
        run: |
          set -euo pipefail
          failed=0
          for d in .skills/*/; do
            name="$(basename "$d")"
            [ -f "${d}SKILL.md" ] || continue
            link=".claude/skills/$name"
            if [ ! -L "$link" ]; then
              echo "::error::$link is missing or not a symlink"
              failed=1
              continue
            fi
            src_real="$(realpath "$d")"
            link_real="$(realpath "$link")"
            if [ "$src_real" != "$link_real" ]; then
              echo "::error::$link resolves to $link_real, expected $src_real"
              failed=1
            fi
          done
          exit "$failed"
